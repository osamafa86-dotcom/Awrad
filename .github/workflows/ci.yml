name: CI

on:
  pull_request:
  push:
    branches: [main, 'build/**']

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54329/awrad
      # Dummy values so the mobile client module (and its static web export) can load in CI.
      EXPO_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-dummy-anon-key
      EXPO_PUBLIC_ADMIN_URL: http://127.0.0.1:3000
      EXPO_NO_TELEMETRY: '1'
      # Dummy values so the admin's Supabase helpers load in unit tests (no `next build` in this job).
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-dummy-anon-key
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm db:reset
      - run: pnpm test

  mobile-web:
    # Task 2.8: static web export in preview mode (PREVIEW-2: fake data, no Supabase), Playwright smoke
    # + axe on it, and proof that a normal export carries no preview code.
    runs-on: ubuntu-latest
    env:
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Production export has no preview code
        env:
          EXPO_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-dummy-anon-key
          EXPO_PUBLIC_ADMIN_URL: http://127.0.0.1:3000
        run: |
          pnpm --filter mobile exec expo export -p web
          # -w: whole words, so expo-router's own `__internal__previewId` does not count.
          if grep -rlw "fakeSupabase\|__preview" apps/mobile/dist/; then echo "preview code in production export" && exit 1; fi
      - name: Preview export
        env:
          EXPO_PUBLIC_PREVIEW: '1'
        run: pnpm --filter mobile exec expo export -p web --clear
      - run: npx playwright install --with-deps chromium
        working-directory: apps/mobile
      - name: Web smoke test
        env:
          EXPO_PUBLIC_PREVIEW: '1'
          E2E_SKIP_EXPORT: '1'
        run: pnpm --filter mobile e2e:web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-web-screenshots
          path: apps/mobile/e2e/screenshots/**
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-web-playwright-report
          path: apps/mobile/playwright-report/
          if-no-files-found: ignore

  admin-e2e:
    # Task 3.1: admin dashboard Playwright, both tiers. Tier (a) (signed out) needs nothing; tier (b)
    # (student / admin / supervisor sign-in) runs against a local Supabase stack started here.
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@v1
        with:
          # The version installed and tested in the dev container (see docs/dev-setup.md).
          version: 3.4.0
      - name: Start Supabase (db, auth, rest, kong, mailpit, edge functions)
        # Applies supabase/migrations and supabase/seed.sql; config in supabase/config.jsonc.
        # A rare Docker Hub "Rate exceeded" on an image pull here is infrastructure, not code: the CLI
        # retries pulls (seen and recovered in run 45932142449); re-run the job if it ever gives up.
        run: supabase start -x studio,imgproxy,logflare,vector,realtime,storage-api,postgres-meta,supavisor
      - name: Export Supabase settings
        run: |
          eval "$(supabase status -o env)"
          # Fail here rather than let the signed-in tier skip itself silently.
          test -n "$API_URL" && test -n "$ANON_KEY" && test -n "$SERVICE_ROLE_KEY"
          echo "::add-mask::$SERVICE_ROLE_KEY"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "E2E_SUPABASE_URL=$API_URL"
            echo "E2E_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"
      - run: npx playwright install --with-deps chromium
        working-directory: apps/admin
      - name: Admin e2e (builds with the stack's URL and key, then next start)
        run: pnpm --filter admin e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: admin-playwright-report
          path: apps/admin/playwright-report/
          if-no-files-found: ignore
