# «أوراد» on the owner's VPS (Task D1; any environment since Task 5.1a): staging is SITE=awrad, a second
# environment (production) is another SITE with its own .env, secrets, web root, volumes and hostnames.
#   docker compose -p "$SITE" --env-file /opt/sites/$SITE/.env -f deploy/vps/docker-compose.yml …
# -p "$SITE" is required: the file names no project (no top-level `name:`), so the project — and with it the
# volumes (<project>_pgdata), the project network (<project>_default) and the containers — comes from -p.
# Omitting -p is a caller's error (compose would fall back to the directory name, "vps").
# From the --env-file: SITE (required, no default — final review ops M4: a production .env without it would have
# joined staging's aliases; must equal -p), ADMIN_HOST, APP_HOST, API_HOST, MAIL_HOST (no defaults: a missing one
# fails `docker compose config`), AWRAD_SECRETS (default /opt/sites/$SITE/secrets), WEB_ROOT (default
# /srv/sites/www/$SITE-app), AWRAD_IMPORT (default /opt/sites/$SITE/import), SMTP_* (default: the Mailpit below),
# and the secrets. See env.example and README.md.
# The path defaults nest (${AWRAD_SECRETS:-/opt/sites/${SITE:?…}/secrets}), which the Compose spec allows;
# the ops task still sets AWRAD_SECRETS and WEB_ROOT explicitly, so a deploy never depends on it.
# No Kong, no Studio, and NO published ports: the main Caddy (deploy-caddy-1, on the external network
# deploy_default) is the only way in, by the ${SITE}-* aliases below.
#
# Names: compose registers every service name as a DNS alias on every network the service joins, and
# deploy_default is shared by every site and by both environments. A service name cannot be a variable, so the
# services that join it carry plain names (auth, rest, functions, mail, admin — as RUNBOOK §2's `php`) and are
# addressed only by their explicit ${SITE}-* aliases (RUNBOOK §2: «اسم صريح لا اسم الخدمة العام»); nothing
# may resolve the plain names. db, migrate and web-build stay on the project network only.

x-restart: &restart
  restart: unless-stopped

services:
  db:
    <<: *restart
    image: supabase/postgres:17.12.0.002
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf", "-c", "log_min_messages=fatal"]
    environment:
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: "5432"
      POSTGRES_PORT: "5432"
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      PGDATABASE: postgres
      POSTGRES_DB: postgres
      JWT_SECRET: ${JWT_SECRET:?}
      JWT_EXP: "3600"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - dbconfig:/etc/postgresql-custom
      # Must be superuser to alter the reserved roles; runs once on an empty volume.
      - ./db-init/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:ro
      - ./db-init/jwt.sql:/docker-entrypoint-initdb.d/init-scripts/99-jwt.sql:ro
      - ./db-init/auth-grants.sql:/docker-entrypoint-initdb.d/init-scripts/99-auth-grants.sql:ro
      - ./db-init/extensions.sql:/docker-entrypoint-initdb.d/init-scripts/99-extensions.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    mem_limit: 1g
    networks:
      default:
        aliases:
          - ${SITE:?ضع SITE في .env (اسم البيئة، مثل awrad)}-db

  # One-shot: `docker compose run --rm migrate` (migrations, then seed.sql once, then NOTIFY pgrst).
  migrate:
    image: postgres:17-alpine
    entrypoint: ["sh", "/work/migrate.sh"]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      PGHOST: ${SITE:?ضع SITE في .env (اسم البيئة، مثل awrad)}-db
    volumes:
      - ./migrate.sh:/work/migrate.sh:ro
      - ../../supabase/migrations:/work/migrations:ro
      - ../../supabase/seed.sql:/work/seed.sql:ro
    depends_on:
      db:
        condition: service_healthy
    networks: [default]
    profiles: [tools]

  auth:
    <<: *restart
    image: supabase/gotrue:v2.198.0
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: "9999"
      API_EXTERNAL_URL: https://${API_HOST:?ضع API_HOST في .env (اسم الواجهة)}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD:?}@${SITE:?ضع SITE في .env (اسم البيئة، مثل awrad)}-db:5432/postgres
      GOTRUE_SITE_URL: https://${ADMIN_HOST:?ضع ADMIN_HOST في .env (اسم لوحة الشيخ)}
      GOTRUE_URI_ALLOW_LIST: https://${ADMIN_HOST:?ضع ADMIN_HOST في .env (اسم لوحة الشيخ)},https://${APP_HOST:?ضع APP_HOST في .env (اسم ويب الطالب)}
      GOTRUE_DISABLE_SIGNUP: "true"
      GOTRUE_JWT_SECRET: ${JWT_SECRET:?}
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
      GOTRUE_MAILER_AUTOCONFIRM: "false"
      GOTRUE_MAILER_OTP_EXP: "600"
      # Mail (Ruling FIN-4): an SMTP provider from .env for production (SMTP_PASS is a secret: masked like the
      # others); without these keys staging keeps its Mailpit (no auth). RATE_LIMIT_EMAIL_SENT is GoTrue's emails per
      # hour for the whole instance — size it for bulk invites in production (D12: up to 300 students).
      GOTRUE_SMTP_HOST: ${SMTP_HOST:-${SITE:?ضع SITE في .env (اسم البيئة، مثل awrad)}-mail}
      GOTRUE_SMTP_PORT: "${SMTP_PORT:-1025}"
      GOTRUE_SMTP_USER: "${SMTP_USER:-}"
      GOTRUE_SMTP_PASS: "${SMTP_PASS:-}"
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_SENDER:-noreply@${ADMIN_HOST:?ضع ADMIN_HOST في .env (اسم لوحة الشيخ)}}
      GOTRUE_SMTP_SENDER_NAME: أوراد
      GOTRUE_SMTP_MAX_FREQUENCY: 1s
      GOTRUE_RATE_LIMIT_EMAIL_SENT: "${RATE_LIMIT_EMAIL_SENT:-60}"
      # Per-client limits on /otp and /verify (a 6-digit code is otherwise brute-forceable; final review ops I1,
      # Ruling FIN-3): GoTrue applies them only when this header names the client. awrad.caddy.tmpl sets it from
      # {client_ip} (replacing any value a client sent). Until the main Caddyfile trusts Cloudflare's ranges
      # (a mahfazapay round), {client_ip} is the Cloudflare edge: coarser, still better than no limit.
      GOTRUE_RATE_LIMIT_HEADER: X-Real-Client-IP
      # The 6-digit code in the email (the app signs in with signInWithOtp + verifyOtp type=email).
      GOTRUE_MAILER_TEMPLATES_MAGIC_LINK: https://${API_HOST:?ضع API_HOST في .env (اسم الواجهة)}/auth-templates/magic-link.html
      GOTRUE_MAILER_SUBJECTS_MAGIC_LINK: رمز الدخول إلى أوراد
      # Without Kong in front, GoTrue answers browser preflights itself; supabase-js sends these headers.
      GOTRUE_CORS_ALLOWED_HEADERS: apikey,x-client-info,x-supabase-api-version,content-type,authorization
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 256m
    networks:
      default:
        aliases:
          - ${SITE:?ضع SITE في .env (اسم البيئة، مثل awrad)}-auth
      web:
        aliases:
          - ${SITE:?ضع SITE في .env (اسم البيئة، مثل awrad)}-auth

  rest:
    <<: *restart
    # supabase/postgrest:v16.6 does not exist on Docker Hub (measured 2026-11-27); PostgREST's own image does.
    image: postgrest/postgrest:v16.6
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD:?}@${SITE:?ضع SITE في .env (اسم البيئة، مثل awrad)}-db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET:?}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_SECRET: ${JWT_SECRET:?}
      PGRST_APP_SETTINGS_JWT_EXP: "3600"
    mem_limit: 256m
    networks:
      default:
        aliases:
          - ${SITE:?ضع SITE في .env (اسم البيئة، مثل awrad)}-rest
      web:
        aliases:
          - ${SITE:?ضع SITE في .env (اسم البيئة، مثل awrad)}-rest

  functions:
    <<: *restart
    image: supabase/edge-runtime:v1.79.5
    # The main router lives outside the read-only functions mount (a nested bind mount cannot create its
    # mount point inside a read-only one); it serves /home/deno/functions/<name>.
    command: ["start", "--main-service", "/home/deno/main"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      SUPABASE_URL: https://${API_HOST:?ضع API_HOST في .env (اسم الواجهة)}
      SUPABASE_ANON_KEY: ${ANON_KEY:?}
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY:?}
      JWT_SECRET: ${JWT_SECRET:?}
      VERIFY_JWT: "true"
      # send-reminders answers 401 to anything but `Bearer <CRON_SECRET>` (the hourly pg_cron job); empty = always 401.
      CRON_SECRET: ${CRON_SECRET:-}
    volumes:
      - ../../supabase/functions:/home/deno/functions:ro
      - ./functions-main/index.ts:/home/deno/main/index.ts:ro
    mem_limit: 768m
    networks:
      default:
        aliases:
          - ${SITE:?ضع SITE في .env (اسم البيئة، مثل awrad)}-functions
      web:
        aliases:
          - ${SITE:?ضع SITE في .env (اسم البيئة، مثل awrad)}-functions

  mail:
    <<: *restart
    image: axllent/mailpit:v1.34.0
    environment:
      # Nothing is kept: messages live in memory and vanish on restart.
      MP_MAX_MESSAGES: "500"
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
      # The web UI and API need the same user/password as Caddy's basic_auth (Caddy forwards the header), so
      # no other container on deploy_default can read the sign-in codes. htpasswd (bcrypt), written by the ops task.
      MP_UI_AUTH_FILE: /run/secrets/mail-ui.htpasswd
    labels:
      # Metadata only (Caddy serves the inbox there); it also makes MAIL_HOST required like the other hosts.
      awrad.public-url: https://${MAIL_HOST:?ضع MAIL_HOST في .env (اسم صندوق البريد)}
    volumes:
      - ${AWRAD_SECRETS:-/opt/sites/${SITE:?ضع SITE في .env (اسم البيئة، مثل awrad)}/secrets}/mail-ui.htpasswd:/run/secrets/mail-ui.htpasswd:ro
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 256m
    networks:
      default:
        aliases:
          - ${SITE:?ضع SITE في .env (اسم البيئة، مثل awrad)}-mail
      web:
        aliases:
          - ${SITE:?ضع SITE في .env (اسم البيئة، مثل awrad)}-mail

  admin:
    <<: *restart
    image: ${SITE:?ضع SITE في .env (اسم البيئة، مثل awrad)}-admin:latest
    build:
      context: ../..
      dockerfile: deploy/vps/Dockerfile.admin
      target: admin
      args:
        NEXT_PUBLIC_SUPABASE_URL: https://${API_HOST:?ضع API_HOST في .env (اسم الواجهة)}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${ANON_KEY:?}
    environment:
      NEXT_PUBLIC_SUPABASE_URL: https://${API_HOST:?ضع API_HOST في .env (اسم الواجهة)}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${ANON_KEY:?}
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    user: node
    mem_limit: 512m
    networks:
      web:
        aliases:
          - ${SITE:?ضع SITE في .env (اسم البيئة، مثل awrad)}-admin

  # One-shot: `docker compose --profile build run --rm web-build` — the Expo web export, swapped atomically
  # into $WEB_ROOT/current (see web-build.sh).
  web-build:
    image: ${SITE:?ضع SITE في .env (اسم البيئة، مثل awrad)}-workspace:latest
    build:
      context: ../..
      dockerfile: deploy/vps/Dockerfile.admin
      target: workspace
    command: ["sh", "deploy/vps/web-build.sh"]
    environment:
      EXPO_PUBLIC_SUPABASE_URL: https://${API_HOST:?ضع API_HOST في .env (اسم الواجهة)}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${ANON_KEY:?}
      EXPO_PUBLIC_ADMIN_URL: https://${ADMIN_HOST:?ضع ADMIN_HOST في .env (اسم لوحة الشيخ)}
      # Sized by the ops task from the memory free right before the export (WEB_BUILD_MEM ≤ 3g, heap ≈ 75%).
      NODE_OPTIONS: --max-old-space-size=${WEB_BUILD_HEAP:-1536}
    volumes:
      - ${WEB_ROOT:-/srv/sites/www/${SITE:?ضع SITE في .env (اسم البيئة، مثل awrad)}-app}:/out
    mem_limit: ${WEB_BUILD_MEM:-2048m}
    networks: [default]
    profiles: [build]

  # One-shot (Ruling FIN-5): the legacy Google Sheets import (scripts/import-legacy) inside the project network, so
  # the database is reached as ${SITE}-db with no published port and the keys stay in .env (libpq variables, not a
  # URL or argv). The CSVs, mapping.json and report.json (names inside, 600) live in $AWRAD_IMPORT on the host,
  # outside both repositories; the output carries counts only (--counts-only is part of the entrypoint).
  #   dc --profile tools run --rm import --daily /import/daily.csv … --mapping /import/mapping.json \
  #      --report /import/report.json [--execute]          (docs/runbook.md «استيراد الجداول القديمة»)
  import:
    image: ${SITE:?ضع SITE في .env (اسم البيئة، مثل awrad)}-workspace:latest
    build:
      context: ../..
      dockerfile: deploy/vps/Dockerfile.admin
      target: workspace
    entrypoint: ["node", "scripts/import-legacy/src/index.ts", "--counts-only"]
    environment:
      PGHOST: ${SITE:?ضع SITE في .env (اسم البيئة، مثل awrad)}-db
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
      PGDATABASE: postgres
      # Accounts for students who left (createMissingAsInactive) go through GoTrue's admin API.
      SUPABASE_URL: https://${API_HOST:?ضع API_HOST في .env (اسم الواجهة)}
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY:?}
    volumes:
      - ${AWRAD_IMPORT:-/opt/sites/${SITE:?ضع SITE في .env (اسم البيئة، مثل awrad)}/import}:/import
    depends_on:
      db:
        condition: service_healthy
    networks: [default]
    profiles: [tools]

volumes:
  pgdata:
  dbconfig:

networks:
  default: {}
  web:
    external: true
    name: deploy_default
