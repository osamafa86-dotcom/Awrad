<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>رمز الدخول إلى أوراد</title>
  </head>
  <body style="margin:0;padding:24px;background:#f6f4ef;font-family:Tahoma,Arial,sans-serif;color:#1d2a24;direction:rtl;text-align:right;">
    <div style="max-width:480px;margin:0 auto;background:#ffffff;border-radius:12px;padding:24px;">
      <h1 style="margin:0 0 12px;font-size:20px;color:#12392c;">أوراد</h1>
      <p style="margin:0 0 16px;font-size:16px;line-height:1.7;">السلام عليكم، هذا رمز الدخول إلى أوراد:</p>
      <p dir="ltr" style="margin:0 0 16px;font-size:36px;font-weight:bold;letter-spacing:8px;text-align:center;font-family:'Courier New',monospace;color:#12392c;">{{ .Token }}</p>
      <p style="margin:0 0 8px;font-size:14px;line-height:1.7;">اكتب الرمز في صفحة الدخول. صلاحيته عشر دقائق.</p>
      <p style="margin:0;font-size:13px;line-height:1.7;color:#5b6660;">إن لم تطلب الدخول فتجاهل هذه الرسالة.</p>
    </div>
  </body>
</html>
